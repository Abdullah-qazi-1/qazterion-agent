name: Qazterion CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-tests:
    name: Python Backend Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio pytest-cov

      - name: Run pytest test suite
        run: |
          pytest -v --tb=short

  frontend-checks:
    name: Frontend Tests, Typechecks & Production Build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: qazterion-ui/package.json

      - name: Install UI dependencies
        working-directory: ./qazterion-ui
        run: npm ci || npm install

      - name: Run frontend unit tests
        working-directory: ./qazterion-ui
        run: npm test -- --run

      - name: Run TypeScript typechecks
        working-directory: ./qazterion-ui
        run: npm run typecheck

      - name: Build Electron & Vite production bundle
        working-directory: ./qazterion-ui
        run: npm run build
