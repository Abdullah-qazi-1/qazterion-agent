[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qazterion"
version = "2.0.0"
description = "Autonomous Multi-Provider Coding Agent and Cross-Platform CLI"
authors = [
    { name = "Abdullah", email = "abdullahizaq321@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "litellm[proxy]>=1.40.0",
    "openai>=1.20.0",
    "PyYAML>=6.0.0",
    "cryptography>=41.0.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
qazterion = "qz_cli.app:main"
qz = "qz_cli.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["qz_*"]
